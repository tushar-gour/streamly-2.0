name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  NODE_ENV: test
  PORT: 8000
  DATABASE_URL: postgresql://streamly:streamly@localhost:5432/streamly_test?schema=public
  TEST_DATABASE_URL: postgresql://streamly:streamly@localhost:5432/streamly_test?schema=public
  RUN_DATABASE_TESTS: "false"
  REDIS_ENABLED: "false"
  REDIS_URL: redis://localhost:6379
  JOBS_ENABLED: "false"
  CACHE_ENABLED: "true"
  DISABLE_RATE_LIMITING_IN_TEST: "true"
  MOCK_CLOUDINARY: "true"
  MEDIA_STORAGE_PROVIDER: cloudinary
  VIDEO_STREAMING_ENABLED: "true"
  AWS_REGION: ap-south-1
  AWS_S3_BUCKET: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_S3_PUBLIC_BASE_URL: ""
  CORS_ORIGIN: "*"
  CORS_CREDENTIALS: "true"
  TRUST_PROXY: "false"
  ACCESS_TOKEN_SECRET: ci_access_token_secret
  ACCESS_TOKEN_EXPIRY: 15m
  REFRESH_TOKEN_SECRET: ci_refresh_token_secret
  REFRESH_TOKEN_EXPIRY: 10d
  EMAIL_VERIFICATION_TOKEN_EXPIRY: 1d
  CLOUDINARY_CLOUD_NAME: ci_cloud
  CLOUDINARY_API_KEY: ci_api_key
  CLOUDINARY_API_SECRET: ci_api_secret
  API_DOCS_ENABLED: "true"
  API_DOCS_ROUTE: /api/v1/docs
  API_DOCS_SPEC_ROUTE: /api/v1/docs/openapi.json
  LOG_LEVEL: silent
  LOG_FORMAT: json
  REQUEST_ID_HEADER: x-request-id
  CORRELATION_ID_HEADER: x-correlation-id

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        id: backend-install
        run: npm ci

      - name: Format check
        id: backend-format
        run: npm run format:check

      - name: Formatting diagnostics
        if: ${{ !cancelled() && steps.backend-format.outcome == 'failure' }}
        run: |
          npm run format
          git diff -- .
          git restore --worktree -- .

      - name: Lint
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: npm run typecheck

      - name: Build
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: npm run build

      - name: Syntax check
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: npm run syntax

      - name: Smoke check
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: npm run smoke

      - name: Verify
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: npm run verify

      - name: Dependency audit report
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        run: npm audit --audit-level=high
        continue-on-error: true

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npm test

      - name: Unit tests
        run: npm run test:unit

      - name: API contract tests
        run: npm run test:api

      - name: Integration tests
        run: npm run test:integration

      - name: Coverage
        run: npm run test:coverage

  database-security:
    name: Database integration and security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamly
          POSTGRES_PASSWORD: streamly
          POSTGRES_DB: streamly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamly -d streamly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_DATABASE_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to isolated test database
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm run test:integration

      - name: Database-backed API contracts
        run: npm run test:api

      - name: Seed isolated storage-test permissions
        run: npm run seed:rbac

      - name: Start disposable S3-compatible storage
        run: |
          docker run --rm -d --name streamly-storage-test -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=streamlytest -e MINIO_ROOT_PASSWORD=streamlytest-secret quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs streamly-storage-test
          exit 1

      - name: Real isolated object-storage and media API integration
        env:
          RUN_STORAGE_TESTS: "true"
        run: npx vitest run tests/integration/private-storage.test.ts

      - name: Remove disposable storage
        if: always()
        run: docker rm -f streamly-storage-test || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: frontend-install
        run: npm ci

      - name: Format check
        id: frontend-format
        run: npm run format:check

      - name: Formatting diagnostics
        if: ${{ !cancelled() && steps.frontend-format.outcome == 'failure' }}
        run: |
          npm run format
          git diff -- .
          git restore --worktree -- .

      - name: Lint
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: npm run build

  browser:
    name: Browser end-to-end and visual smoke
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamly
          POSTGRES_PASSWORD: streamly
          POSTGRES_DB: streamly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamly -d streamly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_DATABASE_TESTS: "true"
      CORS_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      BROWSER_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm ci
      - name: Prepare isolated backend
        run: |
          npx prisma migrate deploy
          npm run seed:rbac
          npx tsx scripts/seed-browser-fixture.mjs
          npm run build
          npm start > "$RUNNER_TEMP/streamly-backend.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/healthcheck > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/streamly-backend.log"
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm run build
          npm start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/streamly-frontend.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/streamly-frontend.log"
          exit 1
      - name: Install pinned browser tooling
        working-directory: frontend
        run: |
          npm install --prefix "$RUNNER_TEMP/streamly-browser" --no-package-lock playwright@1.51.1
          "$RUNNER_TEMP/streamly-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke against real API
        working-directory: frontend
        run: |
          PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/streamly-browser/node_modules/playwright" node tests/browser/smoke.mjs
      - name: Upload screenshots and lab metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamly-browser-results
          path: frontend/browser-results/
          if-no-files-found: warn
      - name: Setup Python for visual diagnostics
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contact sheets for visual inspection
        if: always()
        working-directory: frontend
        run: |
          python -m pip install Pillow==11.2.1
          python scripts/contact-sheets.py

  docs:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI document
        run: npm run docs:validate

  prisma:
    name: Prisma
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker env file
        run: cp .env.docker.example .env.docker

      - name: Build Docker image
        run: docker build -t streamly-server:ci .

      - name: Validate Docker Compose config
        run: docker compose config
